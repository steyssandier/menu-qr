<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menú QR</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- 1. IDIOMA -->
<div id="screen-lang" class="screen active">

<h2>🌍 Selecciona idioma</h2>

<button onclick="setLang('es')">🇪🇸 Castellano</button>
<button onclick="setLang('ca')">🏴 Català</button>
<button onclick="setLang('en')">🇬🇧 English</button>

</div>

<!-- 2. CATEGORÍAS -->
<div id="screen-menu" class="screen hidden">

<h2>📋 Menú</h2>

<button onclick="openMenu('desayunos')">☕ Desayunos</button>
<button onclick="openMenu('carta')">🍽 Carta</button>
<button onclick="openMenu('cocteles')">🍸 Cócteles</button>
<button onclick="openMenu('vinos')">🍷 Vinos</button>

</div>

<!-- 3. PANTALLAS CANVA -->

<div id="desayunos" class="screen hidden">
<img src="desayunos.png" class="menu-img">
<button onclick="back()">⬅ Volver</button>
</div>

<div id="carta" class="screen hidden">
<img src="carta.png" class="menu-img">
<button onclick="back()">⬅ Volver</button>
</div>

<div id="cocteles" class="screen hidden">
<img src="cocteles.png" class="menu-img">
<button onclick="back()">⬅ Volver</button>
</div>

<div id="vinos" class="screen hidden">
<img src="vinos.png" class="menu-img">
<button onclick="back()">⬅ Volver</button>
</div>

<script src="script.js"></script>

</body>
</html>
